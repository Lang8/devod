name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: deutsch }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deutsch
      JWT_SECRET: ci-e2e-secret
      CORS_ORIGINS: http://localhost:4173
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Migrate fresh Postgres and seed deterministic content
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run alembic upgrade head
          PYTHONPATH=. uv run python scripts/seed_e2e.py
      - name: Start API
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && exit 0
            sleep 2
          done
          cat ../api.log; exit 1
      - name: Install frontend deps and Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright E2E
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        run: cat api.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  deploy-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: deutsch }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t deutsch-api backend
      - name: Boot image against Postgres, migrate, probe /healthz
        run: |
          docker run -d --name api --network host -p 8000:8000 \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/deutsch \
            -e JWT_SECRET=ci-secret -e CORS_ORIGINS=http://localhost:5173 deutsch-api
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthz || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs api
          test "$code" = "200"
      - name: Image contains no spacy/anthropic
        run: |
          ! docker run --rm --entrypoint python deutsch-api -c "import spacy" 2>/dev/null
          ! docker run --rm --entrypoint python deutsch-api -c "import anthropic" 2>/dev/null
      - name: Deploy config files present
        run: test -f render.yaml && test -f frontend/vercel.json && test -f .env.example
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Vite production build with API base URL from env
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.com
        run: |
          npm ci
          npm run build
          grep -rq "api.example.com" dist/assets
