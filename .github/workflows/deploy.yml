name: Deploy
# Pipeline: CI gate -> deploy (Render hook + Vercel) -> smoke -> production E2E -> auto rollback on failure.
# Render/Vercel Git auto-deploy must stay OFF for main; this workflow is the only deploy path.
# Secrets come only from GitHub Secrets. The production database URL is never stored here
# (it lives only in the Render service env; migrations run at container start).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
  RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
  PROD_API_URL: ${{ secrets.PROD_API_URL }}
  PROD_FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
  PROD_E2E_EMAIL: ${{ secrets.PROD_E2E_EMAIL }}
  PROD_E2E_PASSWORD: ${{ secrets.PROD_E2E_PASSWORD }}

jobs:
  deploy:
    # CI gate: only after a green CI run on main (or a manual dispatch).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      state: ${{ steps.secrets.outputs.state }}
      render_previous_deploy_id: ${{ steps.deploy.outputs.render_previous_deploy_id }}
      vercel_previous_deployment_id: ${{ steps.deploy.outputs.vercel_previous_deployment_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: secrets
        name: Check deploy secrets (all missing -> skip with warning; partial -> fail)
        env: { JOB_LABEL: deploy }
        run: python3 scripts/deploy/ops.py check-secrets
      - id: deploy
        name: Trigger Render deploy hook and Vercel deploy, wait until live
        if: steps.secrets.outputs.state == 'all_present'
        run: python3 scripts/deploy/ops.py deploy

  smoke:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      state: ${{ steps.secrets.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: secrets
        name: Check deploy secrets
        env: { JOB_LABEL: smoke }
        run: python3 scripts/deploy/ops.py check-secrets
      - name: Smoke (/healthz 200 + frontend loads; 6 attempts x 30s for cold starts)
        if: steps.secrets.outputs.state == 'all_present'
        run: python3 scripts/deploy/ops.py smoke

  e2e:
    needs: [deploy, smoke]
    if: needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: secrets
        name: Check deploy secrets
        working-directory: .
        env: { JOB_LABEL: e2e }
        run: python3 scripts/deploy/ops.py check-secrets
      - if: steps.secrets.outputs.state == 'all_present'
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - if: steps.secrets.outputs.state == 'all_present'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Production Playwright E2E (login with fixed test account, open passage, click word)
        if: steps.secrets.outputs.state == 'all_present'
        env:
          E2E_WEB_URL: ${{ secrets.PROD_FRONTEND_URL }}
        run: npx playwright test e2e/prod-smoke.spec.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  rollback:
    needs: [deploy, smoke, e2e]
    # Roll back when the deploy, smoke or production E2E failed (never when everything was skipped).
    if: >-
      always() && needs.deploy.outputs.state == 'all_present' &&
      (needs.deploy.result == 'failure' || needs.smoke.result == 'failure' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Roll back Render and Vercel independently (partial failure fails the job and is reported)
        env:
          RENDER_PREVIOUS_DEPLOY_ID: ${{ needs.deploy.outputs.render_previous_deploy_id }}
          VERCEL_PREVIOUS_DEPLOYMENT_ID: ${{ needs.deploy.outputs.vercel_previous_deployment_id }}
        run: python3 scripts/deploy/ops.py rollback
      - name: Fail the workflow so the owner is alerted by email
        run: |
          echo "::error::Production deploy failed and was rolled back. DB migrations are NOT rolled back; see docs/runbook.md."
          exit 1
