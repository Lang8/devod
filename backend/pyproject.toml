[project]
name = "deutsch-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "uvicorn>=0.30",
  "sentry-sdk[fastapi]>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pgserver>=0.1.4",
  "httpx>=0.28.1",
  "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]
