goal: Python(FastAPI) + React/Vite SPA + 매니지드 Postgres(PaaS 배포)로, 오프라인 파이프라인(Claude로
  주제별 지문·번역 생성 → spaCy 토큰/lemma·분리동사 분석 → Claude 단어 정보 보강 → DB 저장)과 가벼운 API 서버를 분리해,
  이메일/JWT 로그인 사용자가 지문을 읽고 단어를 클릭해 (기본형+발견형태+문맥) 단어장에 수집하고 규칙 기반 랜덤/필터 퀴즈로 복습하는 개인용
  MVP를 만들며, 학습 상태·이력·다중 주제를 스키마에 미리 반영하고 pytest·Vitest·Playwright·GitHub Actions로
  검증한다.
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- 'Backend: Python (FastAPI). Frontend: React + Vite SPA, responsive web only (no
  native app).'
- 'Database: managed PostgreSQL (Supabase or Neon); deploy backend to a PaaS (e.g.
  Render/Fly.io) and frontend to static hosting (e.g. Vercel). The real deploy is a
  documented manual step; config comes from env vars (DATABASE_URL, JWT secret, CORS origin).'
- 'Offline pipeline only: passages and Korean translations are pre-generated in batch
  per topic/level by Claude (Anthropic API); spaCy (pinned German model version) does
  tokens/lemma/POS first, then a resolution layer (separable-verb svp merge rule +
  override table) and Claude enrichment (meaning, gender, plural, conjugation, ambiguity)
  run at ingest time. Neither spaCy nor the Anthropic SDK is a dependency of the API server.'
- 'Data separation: shared/AI-generated content zone (Topic, Passage, Sentence, Token,
  Word, WordTopic, Phrase) is separate from the per-user zone (User, Discovery, LearningState,
  LearningStateHistory, QuizAttempt); no foreign key from a shared-zone table to a user-zone
  table. The data model is multi-user.'
- 'Quizzes: items are generated by rules (no LLM call at quiz time); selection is
  random/filter-based without spaced-repetition scheduling in MVP; every attempt is
  recorded for future SRS/analytics.'
- 'Deterministic tests: CI never calls the Anthropic API (recorded fixtures or a stub
  client injected into pipeline stages) and runs offline against the pinned spaCy model.'
- MVP UI excludes learning-state tagging popovers, drag phrase selection and keyboard
  shortcuts; the schema must support them.
acceptance_criteria:
- description: Running the offline pipeline command for a topic (e.g. Umwelt) stores
    at least one passage in Postgres with ordered sentences (German + Korean translation)
    and per-token lemma/POS rows.
- description: 'pytest spaCy-only golden cases pass against the pinned model for surface
    forms in context: vermieden→vermeiden, trägt→tragen, gegangen→gehen, geschrieben→schreiben.'
  semantic_ac_key: ac_249eeafb61deba56
- description: 'pytest resolution-layer golden cases pass without network: in a sentence
    with ''... gibt ... zurück'', the token ''gibt'' resolves to ''zurückgeben'' via
    the svp merge rule, and ''wäre'' resolves to ''sein'' via the override table or
    fixture-backed enrichment.'
- description: A user can register and log in with email/password; protected API endpoints
    return 401 without a valid JWT; a cross-user test shows user B gets 404 or an empty
    result when requesting user A's discovery, vocabulary or quiz-attempt IDs.
- description: In the browser, a logged-in user can pick a topic, open a passage,
    view it sentence by sentence, and toggle the Korean translation per sentence.
  semantic_ac_key: ac_b22e1877726c6528
- description: Clicking a word in a passage adds a vocabulary entry showing lemma,
    found surface form, source sentence, passage and date; collecting the same lemma
    from another passage adds a second Discovery without duplicating the Word; the
    user can override the lemma on their own Discovery while the shared Word stays
    unchanged for other users.
- description: 'Alembic migrations apply cleanly to an empty Postgres, and pytest model
    tests assert: unique (lemma, pos) on Word; several active LearningState types per
    (user, word) drawn from an extensible lookup table seeded with UNKNOWN, UNFAMILIAR,
    MEANING, GENDER, PLURAL, INFLECTION, CONTEXT, EXPRESSION; a LearningStateHistory
    row is written on every state change; WordTopic links one Word to multiple Topics;
    Phrase stores multi-token entries.'
- description: A user can start a quiz filtered by topic or all words and answer rule-based
    questions of types German→Korean meaning, Korean→German, multiple choice (distractors
    drawn from the user's vocabulary / same POS), and cloze from the discovery sentence;
    no LLM call happens during quizzes, and every answer is persisted as a quiz attempt.
  semantic_ac_key: ac_ac2b536b4a073bba
- description: 'Deploy readiness is verified in CI: the API Docker image builds, boots
    against a Postgres service container, runs migrations, and GET /healthz returns 200;
    the Vite production build succeeds with the API base URL from env; render.yaml (or
    fly.toml), vercel.json with an SPA rewrite, and .env.example are committed; and a
    check fails if the API package imports or depends on spacy or anthropic.'
- description: On every pull request GitHub Actions runs backend lint+pytest, frontend
    lint+Vitest, and a Playwright E2E against a freshly migrated Postgres service container
    covering register → login → open passage → click word → see it in vocabulary →
    complete a quiz; the main branch is green.
ontology_schema:
  name: DeutschTrainerDomain
  description: Domain entities for the Deutsch Trainer MVP, split into a shared/AI-generated
    content zone and a per-user zone (no FK from shared to user tables). Token separable-verb
    fields are provisional until a spaCy probe confirms the approach. Revised in refinement
    pass 1 from the session-settled contract.
  fields:
  - name: Topic
    field_type: entity
    description: 'Shared zone. id, slug, name_de, name_ko, level (CEFR).'
  - name: Passage
    field_type: entity
    description: 'Shared zone. id, topic_id→Topic, title, level, source=llm, model_version,
      generated_at.'
  - name: Sentence
    field_type: entity
    description: 'Shared zone. id, passage_id→Passage, position (ordered int), text_de,
      text_ko.'
  - name: Token
    field_type: entity
    description: 'Shared zone. id, sentence_id→Sentence, position, surface, lemma (spaCy),
      pos, separable_head_token_id?→Token (provisional), resolved_lemma (provisional,
      e.g. zurückgeben), word_id?→Word.'
  - name: Word
    field_type: entity
    description: 'Shared zone. id, lemma, pos, meaning_ko, gender?, plural?, conjugation
      (json), synonyms/antonyms (json, optional); unique (lemma, pos).'
  - name: WordTopic
    field_type: relation
    description: 'Shared zone. word_id→Word, topic_id→Topic; many-to-many.'
  - name: Phrase
    field_type: entity
    description: 'Shared zone. id, text, meaning_ko, token span (sentence_id, start/end
      position) for multi-token expressions.'
  - name: User
    field_type: entity
    description: 'User zone. id, email (unique), password_hash, created_at.'
  - name: Discovery
    field_type: entity
    description: 'User zone. id, user_id→User, word_id→Word (or phrase_id→Phrase), token_id→Token,
      surface_form, sentence_id, passage_id, lemma_override?, created_at. One Word can
      have many Discoveries per user.'
  - name: LearningStateType
    field_type: lookup
    description: 'Extensible lookup rows: UNKNOWN, UNFAMILIAR, MEANING, GENDER, PLURAL,
      INFLECTION, CONTEXT, EXPRESSION.'
  - name: LearningState
    field_type: entity
    description: 'User zone. id, user_id→User, word_id→Word, state_type→LearningStateType,
      active (bool), resolved_at?; unique (user_id, word_id, state_type); several active
      per (user, word).'
  - name: LearningStateHistory
    field_type: entity
    description: 'User zone. id, learning_state_id→LearningState, event (added|resolved|reopened),
      at.'
  - name: QuizAttempt
    field_type: entity
    description: 'User zone. id, user_id→User, word_id→Word, discovery_id?→Discovery,
      question_type (de_ko|ko_de|mcq|cloze), answer, correct (bool), at.'
evaluation_principles:
- name: layer_separation
  description: No spaCy or LLM in the API process or at quiz time; the shared/user zone
    rule holds (no FK from shared-zone to user-zone tables).
  weight: 0.35
- name: data_model_fidelity
  description: Schema invariants hold (Word dedup, lemma vs surface form, multi-state
    with history, many-to-many topics, per-user overrides).
  weight: 0.35
- name: verifiability
  description: Every constraint is backed by a test or CI gate, and CI is deterministic
    (no network LLM calls, pinned spaCy model).
  weight: 0.3
exit_conditions:
- name: all_acceptance_criteria_pass
  description: The MVP is complete when every acceptance criterion passes.
  criteria: Every listed acceptance criterion passes and the GitHub Actions workflow
    (including the deploy-readiness and E2E jobs) is green on main.
